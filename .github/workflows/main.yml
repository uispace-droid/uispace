name: Auto Publish GameMonetize to Blogger

on:
  schedule:
    - cron: '0 */6 * * *'  # يعمل تلقائياً كل 6 ساعات
  workflow_dispatch:      # يتيح التشغيل اليدوي أيضاً عند الحاجة

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-auth google-auth-oauthlib google-api-python-client

      - name: Run GameMonetize Publisher
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python -c "
          import os
          import requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          # إعداد بيانات المصادقة لمدونة بلوجر
          creds = Credentials(
              None,
              refresh_token=os.environ.get('BLOGGER_REFRESH_TOKEN'),
              client_id=os.environ.get('BLOGGER_CLIENT_ID'),
              client_secret=os.environ.get('BLOGGER_CLIENT_SECRET'),
              token_uri='https://oauth2.googleapis.com/token'
          )
          
          blogger_service = build('blogger', 'v3', credentials=creds)
          blog_id = os.environ.get('BLOGGER_BLOG_ID')

          # 1. جلب عناوين المنشورات الموجودة مسبقاً لتجنب التكرار
          existing_titles = set()
          try:
              posts_request = blogger_service.posts().list(blogId=blog_id, maxResults=500)
              posts_response = posts_request.execute()
              if 'items' in posts_response:
                  for post in posts_response['items']:
                      existing_titles.add(post.get('title'))
          except Exception as e:
              print('ملاحظة أثناء جلب المنشورات القديمة:', e)

          # 2. جلب الألعاب من API GameMonetize
          api_url = 'https://gamemonetize.com/feed.php?format=0&page=1'
          response = requests.get(api_url)
          
          if response.status_code == 200:
              games = response.json()
              selected_game = None
              
              # البحث عن أول لعبة لم يتم نشرها مسبقاً
              for game in games:
                  game_title = game.get('title', '')
                  if game_title and game_title not in existing_titles:
                      selected_game = game
                      break
              
              if selected_game:
                  game_title = selected_game.get('title')
                  game_thumbnail = selected_game.get('image', '')
                  game_description = selected_game.get('description', 'استمتع بأحدث ألعاب HTML5 مباشرة.')
                  game_category = selected_game.get('category', 'ألعاب')
                  game_url = selected_game.get('url', '')
                  
                  # تصميم محتوى المنشور ليشمل الصورة والوصف وإطار اللعبة
                  content_html = f'''
                  <div style=\"text-align:center; margin-bottom: 20px;\">
                      <img src=\"{game_thumbnail}\" alt=\"{game_title}\" style=\"max-width:100%; height:auto; border-radius: 8px;\" />
                  </div>
                  <div style=\"margin-bottom: 20px; font-size: 16px; line-height: 1.6;\">
                      <p><strong>وصف اللعبة:</strong> {game_description}</p>
                  </div>
                  <div style=\"text-align:center\">
                      <iframe src=\"{game_url}\" width=\"100%\" height=\"600px\" frameborder=\"0\" scrolling=\"no\"></iframe>
                  </div>
                  '''

                  post_body = {
                      'title': game_title,
                      'content': content_html,
                      'labels': [game_category]
                  }

                  request = blogger_service.posts().insert(blogId=blog_id, body=post_body)
                  result = request.execute()
                  print('تم نشر اللعبة بنجاح من GameMonetize! المعرف:', result.get('id'))
              else:
                  print('جميع الألعاب في هذه الصفحة تم نشرها مسبقاً!')
          "

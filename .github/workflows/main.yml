name: Auto Publish GameMonetize to Blogger

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install cloudscraper google-auth google-auth-oauthlib google-api-python-client

      - name: Run publisher script
        env:
          BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import cloudscraper
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          BLOG_ID = os.environ.get('BLOG_ID')
          CLIENT_ID = os.environ.get('CLIENT_ID')
          CLIENT_SECRET = os.environ.get('CLIENT_SECRET')
          REFRESH_TOKEN = os.environ.get('REFRESH_TOKEN')

          def main():
              if not all([BLOG_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN]):
                  print("خطأ في بيانات الـ Secrets.")
                  return

              scraper = cloudscraper.create_scraper()
              url = 'https://gamemonetize.com/feed.php?format=0&page=1'
              print("جاري جلب الألعاب...")
              response = scraper.get(url)

              if response.status_code != 200:
                  print("فشل الاتصال بالموقع.")
                  return

              games = response.json()
              creds = Credentials(None, refresh_token=REFRESH_TOKEN, client_id=CLIENT_ID, client_secret=CLIENT_SECRET, token_uri="https://oauth2.googleapis.com/token")
              service = build('blogger', 'v3', credentials=creds)

              existing_titles = set()
              try:
                  request = service.posts().list(blogId=BLOG_ID, maxResults=500)
                  while request:
                      response_posts = request.execute()
                      for post in response_posts.get('items', []):
                          existing_titles.add(post.get('title'))
                      request = service.posts().list_next(request, response_posts)
              except Exception as e:
                  print(f"تحذير أثناء جلب المشاركات السابقة: {e}")

              published_count = 0
              max_publish = 5

              for game in games:
                  if published_count >= max_publish:
                      break

                  title = game.get('title') or game.get('name')
                  if not title or title in existing_titles:
                      continue

                  description = game.get('description', '')
                  game_url = game.get('url', '')
                  category = game.get('category', 'Arcade')
                  thumb_url = game.get('thumb') or game.get('image') or ''

                  html_content = f'''
                  <div class="separator" style="clear: both; text-align: center;">
                      <img src="{thumb_url}" alt="{title}" style="max-width: 100%; height: auto; margin-bottom: 15px;" />
                  </div>
                  <iframe src="{game_url}" width="100%" height="600px" frameborder="0" scrolling="no" allowfullscreen="true" style="border:none;"></iframe>
                  <p>{description}</p>
                  '''

                  post_body = {
                      'title': title,
                      'content': html_content,
                      'labels': ['Games', category]
                  }

                  try:
                      request = service.posts().insert(blogId=BLOG_ID, body=post_body, isDraft=False)
                      request.execute()
                      print(f"تم بنجاح نشر اللعبة: {title}")
                      published_count += 1
                  except Exception as e:
                      print(f"خطأ أثناء النشر: {e}")

          if __name__ == '__main__':
              main()
          EOF

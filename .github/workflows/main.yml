name: Auto Publish GameMonetize to Blogger

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install cloudscraper google-auth google-auth-oauthlib google-api-python-client

      - name: Run publisher script
        env:
          BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import cloudscraper
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          BLOG_ID = os.environ.get('BLOG_ID')
          CLIENT_ID = os.environ.get('CLIENT_ID')
          CLIENT_SECRET = os.environ.get('CLIENT_SECRET')
          REFRESH_TOKEN = os.environ.get('REFRESH_TOKEN')

          def main():
              if not all([BLOG_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN]):
                  print("خطأ: يرجى التحقق من إعدادات الـ Secrets في جيت هب.")
                  return

              # إنشاء كاشف لتجاوز حماية Cloudflare
              scraper = cloudscraper.create_scraper()
              
              url = 'https://gamemonetize.com/feed.php?format=0&page=1'
              print("جاري تخطي الحماية وجلب البيانات من الموقع...")
              response = scraper.get(url)

              print(f"كود الاستجابة: {response.status_code}")

              if response.status_code != 200:
                  print("فشل الاتصال حتى بعد تجاوز الحماية.")
                  return

              try:
                  games = response.json()
                  print(f"تم بنجاح جلب {len(games)} لعبة!")
              except Exception as e:
                  print("فشل قراءة ملف الـ JSON، محتوى الاستجابة:", response.text[:300])
                  return

              creds = Credentials(
                  None,
                  refresh_token=REFRESH_TOKEN,
                  client_id=CLIENT_ID,
                  client_secret=CLIENT_SECRET,
                  token_uri="https://oauth2.googleapis.com/token"
              )
              service = build('blogger', 'v3', credentials=creds)

              published_count = 0
              for game in games:
                  title = game.get('title') or game.get('name')
                  if not title:
                      continue

                  description = game.get('description', '')
                  game_url = game.get('url', '')
                  category = game.get('category', 'Arcade')

                  # المحتوى النظيف الذي يتكفل القالب الجديد بتنسيقه
                  html_content = f'''
                  <iframe src="{game_url}" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen="true" style="border:none;"></iframe>
                  <p>{description}</p>
                  '''

                  post_body = {
                      'title': title,
                      'content': html_content,
                      'labels': ['Games', category]
                  }

                  try:
                      request = service.posts().insert(
                          blogId=BLOG_ID, 
                          body=post_body, 
                          isDraft=False
                      )
                      request.execute()
                      published_count += 1
                      print(f"تم نشر اللعبة بنجاح: {title}")
                  except Exception as e:
                      print(f"خطأ أثناء نشر {title}: {e}")

                  # نشر أول 10 ألعاب في كل عملية تشغيل
                  if published_count >= 10:
                      break

              print(f"تم الانتهاء بنجاح. إجمالي ما تم نشره: {published_count} لعبة.")

          if __name__ == '__main__':
              main()
          EOF

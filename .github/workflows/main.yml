name: Auto Publish GameMonetize to Blogger

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-auth google-auth-oauthlib google-api-python-client

      - name: Run publisher script
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          BLOG_ID = os.environ.get('BLOG_ID')
          CLIENT_ID = os.environ.get('CLIENT_ID')
          CLIENT_SECRET = os.environ.get('CLIENT_SECRET')
          REFRESH_TOKEN = os.environ.get('REFRESH_TOKEN')

          def main():
              if not all([BLOG_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN]):
                  print("خطأ: يرجى التحقق من إعدادات الـ Secrets في جيت هب.")
                  return

              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              }
              
              creds = Credentials(
                  None,
                  refresh_token=REFRESH_TOKEN,
                  client_id=CLIENT_ID,
                  client_secret=CLIENT_SECRET,
                  token_uri="https://oauth2.googleapis.com/token"
              )
              service = build('blogger', 'v3', credentials=creds)

              page = 1
              total_published = 0

              # حلقة تكرارية لجلب الألعاب عبر الصفحات باستخدام الرابط الصحيح
              while True:
                  url = f'https://gamemonetize.com/feed.php?format=0&page={page}'
                  print(f"جاري جلب الصفحة رقم {page}...")
                  response = requests.get(url, headers=headers)

                  if response.status_code != 200:
                      print(f"فشل الاتصال بالموقع. الكود: {response.status_code}")
                      break

                  try:
                      games = response.json()
                  except Exception as e:
                      print("خطأ في قراءة ملف JSON أو انتهاء الصفحات:", e)
                      break

                  if not games or not isinstance(games, list) or len(games) == 0:
                      print("لا توجد ألعاب أخرى متاحة.")
                      break

                  print(f"تم العثور على {len(games)} لعبة في الصفحة {page}. جاري النشر...")

                  for game in games:
                      title = game.get('title') or game.get('name')
                      if not title:
                          continue

                      description = game.get('description', '')
                      game_url = game.get('url', '')
                      category = game.get('category', 'Arcade')

                      # إرسال المحتوى النظيف، والقالب الجديد سيتكفل بالباقي
                      html_content = f'''
                      <iframe src="{game_url}" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen="true" style="border:none;"></iframe>
                      <p>{description}</p>
                      '''

                      post_body = {
                          'title': title,
                          'content': html_content,
                          'labels': ['Games', category]
                      }

                      try:
                          request = service.posts().insert(
                              blogId=BLOG_ID, 
                              body=post_body, 
                              isDraft=False
                          )
                          request.execute()
                          total_published += 1
                          print(f"تم بنجاح نشر: {title} [التصنيف: {category}]")
                      except Exception as e:
                          print(f"خطأ أثناء نشر {title}: {e}")

                  # الانتقال للصفحة التالية (يمكنك تعديل الحد الأقصى للصفحات هنا إذا أردت)
                  page += 1
                  if page > 2: # ينشر أول صفحتين في كل عملية تشغيل لتفادي تجاوز وقت التشغيل المجاني
                      print("تم إكمال دورة النشر بنجاح.")
                      break

              print(f"إجمالي الألعاب المنشورة في هذه الجلسة: {total_published}")

          if __name__ == '__main__':
              main()
          EOF

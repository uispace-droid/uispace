name: Auto Publish GameMonetize to Blogger

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-auth google-auth-oauthlib google-api-python-client

      - name: Run publisher script
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from bs4 import BeautifulSoup
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          BLOG_ID = os.environ.get('BLOG_ID')
          CLIENT_ID = os.environ.get('CLIENT_ID')
          CLIENT_SECRET = os.environ.get('CLIENT_SECRET')
          REFRESH_TOKEN = os.environ.get('REFRESH_TOKEN')

          def main():
              if not all([BLOG_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN]):
                  print("خطأ: يرجى التحقق من إعدادات الـ Secrets في جيت هب.")
                  return

              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              }
              
              creds = Credentials(
                  None,
                  refresh_token=REFRESH_TOKEN,
                  client_id=CLIENT_ID,
                  client_secret=CLIENT_SECRET,
                  token_uri="https://oauth2.googleapis.com/token"
              )
              service = build('blogger', 'v3', credentials=creds)

              url = 'https://gamemonetize.com/'
              print("جاري الدخول إلى الموقع وسحب الألعاب مباشرة من الصفحة...")
              response = requests.get(url, headers=headers)

              if response.status_code != 200:
                  print(f"فشل الاتصال بالموقع. الكود: {response.status_code}")
                  return

              # تحليل محتوى الـ HTML للصفحة
              soup = BeautifulSoup(response.text, 'html.parser')
              games_found = 0

              # البحث عن الروابط والعناصر التي تخص الألعاب داخل الصفحة
              for item in soup.find_all('a', href=True):
                  href = item['href']
                  # استهداف الروابط الخاصة باللعبة
                  if '/game/' in href:
                      game_url = href if href.startswith('http') else f"https://gamemonetize.com{href}"
                      title = item.get_text(strip=True)
                      
                      if title and len(title) > 2:
                          html_content = f'''
                          <iframe src="{game_url}" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen="true" style="border:none;"></iframe>
                          <p>لعبة مميزة تم جلبها مباشرة من الموقع.</p>
                          '''

                          post_body = {
                              'title': title,
                              'content': html_content,
                              'labels': ['Games', 'Arcade']
                          }

                          try:
                              request = service.posts().insert(
                                  blogId=BLOG_ID, 
                                  body=post_body, 
                                  isDraft=False
                              )
                              request.execute()
                              games_found += 1
                              print(f"تم بنجاح نشر اللعبة: {title}")
                          except Exception as e:
                              print(f"خطأ أثناء نشر {title}: {e}")

                          # تحديد عدد الألعاب في كل عملية تشغيل لتفادي الضغط
                          if games_found >= 15:
                              break

              print(f"تم الانتهاء. إجمالي الألعاب المنشورة مباشرة: {games_found}")

          if __name__ == '__main__':
              main()
          EOF

name: Auto Publish GameMonetize to Blogger

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-auth google-auth-oauthlib google-api-python-client

      - name: Run publisher script
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          BLOG_ID = os.environ.get('BLOG_ID')
          CLIENT_ID = os.environ.get('CLIENT_ID')
          CLIENT_SECRET = os.environ.get('CLIENT_SECRET')
          REFRESH_TOKEN = os.environ.get('REFRESH_TOKEN')

          def main():
              # التحقق من وجود المفاتيح السرية
              if not all([BLOG_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN]):
                  print("خطأ: يرجى التأكد من إضافة جميع الـ Secrets داخل إعدادات جيت هب (BLOG_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN).")
                  return

              # ترويسة متصفح لتفادي حظر GameMonetize
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              }
              
              url = 'https://gamemonetize.com/feed.php?format=json'
              print("جاري جلب قائمة الألعاب من GameMonetize...")
              response = requests.get(url, headers=headers)

              if response.status_code != 200:
                  print(f"فشل الاتصال بالموقع. كود الاستجابة: {response.status_code}")
                  return

              try:
                  games = response.json()
              except Exception as e:
                  print("حدث خطأ أثناء قراءة قائمة الألعاب (JSON):", e)
                  print("استجابة الموقع كانت:", response.text[:200])
                  return

              # الاتصال بـ Blogger API
              creds = Credentials(
                  None,
                  refresh_token=REFRESH_TOKEN,
                  client_id=CLIENT_ID,
                  client_secret=CLIENT_SECRET,
                  token_uri="https://oauth2.googleapis.com/token"
              )
              service = build('blogger', 'v3', credentials=creds)

              print(f"تم جلب {len(games)} لعبة بنجاح. جارٍ البدء في النشر...")

              for game in games:
                  title = game.get('title')
                  description = game.get('description', '')
                  thumb = game.get('thumb', '')
                  game_url = game.get('url', '')
                  category = game.get('category', 'Arcade')

                  html_content = f'''
                  <div class="game-container" style="text-align:center;">
                      <div style="margin-bottom:15px;">
                          <img src="{thumb}" alt="{title}" style="max-width:100%; height:auto; border-radius:10px;" />
                      </div>
                      <div style="text-align:right; margin-bottom:20px; font-size:16px;">
                          <p>{description}</p>
                      </div>
                      <div style="margin:20px 0;">
                          <iframe src="{game_url}" width="100%" height="600px" frameborder="0" scrolling="no" allowfullscreen="true"></iframe>
                      </div>
                  </div>
                  '''

                  post_body = {
                      'title': title,
                      'content': html_content,
                      'labels': ['Games', category]
                  }

                  try:
                      request = service.posts().insert(blogId=BLOG_ID, body=post_body)
                      request.execute()
                      print(f"تم نشر اللعبة بنجاح: {title}")
                  except Exception as e:
                      print(f"خطأ أثناء نشر {title}: {e}")

          if __name__ == '__main__':
              main()
          EOF

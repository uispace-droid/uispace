name: Auto Publish GameMonetize to Blogger

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-auth google-auth-oauthlib google-api-python-client

      - name: Run publisher script
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          BLOG_ID = os.environ.get('BLOG_ID')
          CLIENT_ID = os.environ.get('CLIENT_ID')
          CLIENT_SECRET = os.environ.get('CLIENT_SECRET')
          REFRESH_TOKEN = os.environ.get('REFRESH_TOKEN')

          def main():
              creds = Credentials(
                  None,
                  refresh_token=REFRESH_TOKEN,
                  client_id=CLIENT_ID,
                  client_secret=CLIENT_SECRET,
                  token_uri="https://oauth2.googleapis.com/token"
              )
              service = build('blogger', 'v3', credentials=creds)

              response = requests.get('https://gamemonetize.com/feed.php?format=json')
              games = response.json()

              print(f"تم العثور على {len(games)} لعبة. جارٍ النشر بكل التفاصيل...")

              for game in games:
                  title = game.get('title')
                  description = game.get('description', '')
                  thumb = game.get('thumb', '')      # رابط صورة اللعبة
                  game_url = game.get('url', '')     # رابط اللعبة (iframe)
                  category = game.get('category', 'Arcade') # تصنيف اللعبة

                  # تنسيق المحتوى ليشمل الصورة، الوصف، واللعبة
                  html_content = f'''
                  <div class="game-container" style="text-align:center;">
                      <div style="margin-bottom:15px;">
                          <img src="{thumb}" alt="{title}" style="max-width:100%; height:auto; border-radius:10px;" />
                      </div>
                      <div style="text-align:right; margin-bottom:20px; font-size:16px;">
                          <p>{description}</p>
                      </div>
                      <div style="margin:20px 0;">
                          <iframe src="{game_url}" width="100%" height="600px" frameborder="0" scrolling="no" allowfullscreen="true"></iframe>
                      </div>
                  </div>
                  '''

                  # إرسال العنوان، المحتوى، والتصنيف (Labels)
                  post_body = {
                      'title': title,
                      'content': html_content,
                      'labels': ['Games', category]
                  }

                  try:
                      request = service.posts().insert(blogId=BLOG_ID, body=post_body)
                      request.execute()
                      print(f"تم نشر اللعبة بنجاح: {title} (التصنيف: {category})")
                  except Exception as e:
                      print(f"خطأ أثناء نشر اللعبة {title}: {e}")

          if __name__ == '__main__':
              main()
          EOF
